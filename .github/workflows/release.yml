name: Release

# Releases are manual and always start as a DRAFT.
#
# Run Actions -> Release -> Run workflow and pick the bump type. The workflow
# bumps the version in package.json, src-tauri/tauri.conf.json,
# src-tauri/Cargo.toml and Cargo.lock, commits it, tags vX.Y.Z, then builds every
# platform and uploads the bundles + latest.json to a DRAFT GitHub release. Open
# the draft, review it, and click "Publish release" to ship.
#
# Re-running a version that is already in the repo is safe: "explicit" with the
# current version skips the bump commit and only tags + builds. The job is
# idempotent, so a failed build can simply be re-run.
#
# Write the vX.Y.Z section in CHANGELOG.md before running: it becomes both the
# release body and latest.json's notes, which is the "What's new" the app shows.
#
# Publishing the draft is what makes the update live: the in-app updater reads
# releases/latest/download/latest.json, which only resolves to published
# (non-draft, non-prerelease) releases.
#
# Pushing to `main` runs ci.yml only — it does not release.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           (contents of ~/.tauri/datapulse.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (empty string if the key has no password)
#
# Optional (macOS signing + notarization; without them macOS builds are unsigned):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - explicit
      version:
        description: "Exact version, e.g. 1.0.0 (only used when bump = explicit)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.bump.outputs.release }}
      ref: ${{ steps.bump.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit and tag
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          BUMP="${BUMP:-patch}"
          VERSION="${VERSION:-}"
          CURRENT=$(node -p "require('./package.json').version")

          if [ "$BUMP" = "explicit" ]; then
            if [ -z "$VERSION" ]; then
              echo "bump = explicit requires the 'version' input" >&2
              exit 1
            fi
            if [ "$VERSION" = "$CURRENT" ]; then
              NEXT="$CURRENT"
            else
              NEXT=$(node scripts/bump-version.mjs "$VERSION")
            fi
          else
            NEXT=$(node scripts/bump-version.mjs "$BUMP")
          fi

          if [ "$NEXT" = "$CURRENT" ]; then
            echo "Version is already $NEXT — tagging and building without a bump commit."
          else
            git add package.json landing/package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
            git commit -m "chore: release v$NEXT [skip ci]"

            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "branch push failed after 3 attempts" >&2
                exit 1
              fi
              echo "push rejected (attempt $attempt/3) — rebasing and retrying…"
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
          fi

          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
            echo "Tag v$NEXT already exists."
          else
            git tag "v$NEXT"
          fi
          git push origin "v$NEXT"

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Releasing v$NEXT"

  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # Only forward Apple secrets that actually exist. Passing an empty
      # APPLE_CERTIFICATE makes Tauri think it must codesign and the build fails.
      - name: Configure Apple signing and notarization
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              echo "$name=$value" >> "$GITHUB_ENV"
            fi
          done

      - name: Read release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          body="$(node scripts/release-notes.mjs)"
          {
            echo 'body<<EOF'
            echo "$body"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "DataPulse v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
