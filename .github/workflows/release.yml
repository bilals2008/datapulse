name: Release

# Releases are automatic and always start as a DRAFT — you never need to open
# the Actions tab and click "Run workflow".
#
# Every push to `main` (that is not itself a release commit) bumps the patch
# version in package.json, src-tauri/tauri.conf.json, src-tauri/Cargo.toml and
# Cargo.lock, commits it, tags vX.Y.Z, then builds every platform and uploads
# the bundles + latest.json to a DRAFT GitHub release. Open the draft, review
# it, and click "Publish release" to ship.
#
# Publishing the draft is what makes the update live: the in-app updater reads
# releases/latest/download/latest.json, which only resolves to published
# (non-draft, non-prerelease) releases.
#
# Need a minor/major bump or an exact version instead? Run the workflow
# manually (Actions -> Release -> Run workflow) and pick the bump type.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           (contents of ~/.tauri/datapulse.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (empty string if the key has no password)
#
# Optional (macOS signing + notarization; without them macOS builds are unsigned):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - explicit
      version:
        description: "Exact version, e.g. 1.0.0 (only used when bump = explicit)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.bump.outputs.release }}
      ref: ${{ steps.bump.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit and tag
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Never release on top of our own release commit — that would loop.
          LAST=$(git log -1 --pretty=%s)
          if [[ "$LAST" == "chore: release v"* ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Head commit is a release commit — nothing to release."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP="${BUMP:-patch}"
            VERSION="${VERSION:-}"
          else
            BUMP="patch"
            VERSION=""
          fi

          if [ "$BUMP" = "explicit" ]; then
            if [ -z "$VERSION" ]; then
              echo "bump = explicit requires the 'version' input" >&2
              exit 1
            fi
            NEXT=$(node scripts/bump-version.mjs "$VERSION")
          else
            NEXT=$(node scripts/bump-version.mjs "$BUMP")
          fi

          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: release v$NEXT [skip ci]"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "branch push failed after 3 attempts" >&2
              exit 1
            fi
            echo "push rejected (attempt $attempt/3) — rebasing and retrying…"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done

          git tag "v$NEXT"
          git push origin "v$NEXT"

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Releasing v$NEXT"

  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Build and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "DataPulse v__VERSION__"
          releaseBody: "Download the installer for your platform below. Installed copies update automatically."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
