name: Feature request
description: Suggest something DataPulse should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to find out or do that DataPulse does not help with today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you would like
      description: Describe the behavior you want. Sketches welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
      description: Other tools, workarounds, or the OS's own usage views.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Fit
      options:
        - label: This keeps working with no network requests of its own (DataPulse stores everything locally).
          required: false
